name: VigiLo CI/CD Pipeline & Quality Gates

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Quality & Automated PyTest Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy

      - name: Code Quality Linting
        run: |
          flake8 src/ service/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Test Suite
        run: |
          python -m pytest tests/

  security-scan:
    name: CodeQL & Security Audit Scan
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-release:
    name: Build Signed Executables & Publish Release Artifacts
    needs: [lint-and-test, security-scan]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable Binaries
        run: |
          pyinstaller --noconfirm monitor.spec

      - name: Verify Binary Checksums
        run: |
          python scripts/signing/verify_signature.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            release_metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
